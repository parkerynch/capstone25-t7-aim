---
#-----------------------------------
# Dummmy Environment Variables.
#-----------------------------------
# default
default_env: &default_env
    LS: 0 # log silence.
    LC: 1 # line-coloring
    TS: 1 # time-stamp in line
    NAME: '' # profile name (should be empty for this `none` env)

#-----------------------------------
# local development configuration.
local:
    <<: *default_env
    STAGE: 'local'
    GEMINI_API_KEY: 'AIzaSyA7gTmtisBsbgs1UyOHURoG3tXLUjaAWCk' # Replace with your actual Gemini API key
    # LocalStack AWS credentials
    AWS_ACCESS_KEY_ID: 'test'
    AWS_SECRET_ACCESS_KEY: 'test'
    AWS_DEFAULT_REGION: 'ap-northeast-2'
    AWS_ENDPOINT_URL: 'http://localhost:4566'
    AWS_S3_FORCE_PATH_STYLE: 'true'

#-----------------------------------
# development server
dev:
    <<: *default_env
    STAGE: 'develop'

#-----------------------------------
# production with AWS deploy
prod:
    <<: *default_env
    STAGE: 'production'
    NS: SS
    TS: 0
